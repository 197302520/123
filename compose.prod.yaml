x-backend-environment: &backend-environment
  DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?set DJANGO_SECRET_KEY}
  DJANGO_DEBUG: "0"
  DJANGO_SECURE_SSL: ${DJANGO_SECURE_SSL:-1}
  DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:?set DJANGO_ALLOWED_HOSTS}
  DJANGO_CSRF_TRUSTED_ORIGINS: ${DJANGO_CSRF_TRUSTED_ORIGINS:?set DJANGO_CSRF_TRUSTED_ORIGINS}
  DJANGO_TRUST_PROXY_HEADERS: "1"
  DJANGO_NUM_PROXIES: ${DJANGO_NUM_PROXIES:-1}
  POSTGRES_DB: ${POSTGRES_DB:-social_network}
  POSTGRES_USER: ${POSTGRES_USER:-social_network}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
  POSTGRES_HOST: postgres
  REDIS_URL: redis://redis:6379/0
  CACHE_URL: redis://redis:6379/1
  CELERY_TASK_ALWAYS_EAGER: "0"
  MAX_UPLOAD_BYTES: "20971520"
  PUBLIC_MAX_NODES: "2000"
  PUBLIC_MAX_EDGES: "20000"
  PUBLIC_OPERATION_RATE: ${PUBLIC_OPERATION_RATE:-240/hour}
  PUBLIC_STANDARD_ALGORITHM_RATE: ${PUBLIC_STANDARD_ALGORITHM_RATE:-120/hour}
  PUBLIC_HEAVY_ALGORITHM_RATE: ${PUBLIC_HEAVY_ALGORITHM_RATE:-30/hour}
  TEACHER_LOGIN_ATTEMPTS: ${TEACHER_LOGIN_ATTEMPTS:-5}
  TEACHER_LOGIN_WINDOW_SECONDS: ${TEACHER_LOGIN_WINDOW_SECONDS:-900}
  RUN_LEASE_SECONDS: ${RUN_LEASE_SECONDS:-900}
  RUN_HEARTBEAT_SECONDS: ${RUN_HEARTBEAT_SECONDS:-30}
  PENDING_DELIVERY_SECONDS: ${PENDING_DELIVERY_SECONDS:-120}
  RUN_MONITOR_SECONDS: ${RUN_MONITOR_SECONDS:-1}
  RUN_CHILD_TERMINATE_GRACE_SECONDS: ${RUN_CHILD_TERMINATE_GRACE_SECONDS:-5}

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-social_network}
      POSTGRES_USER: ${POSTGRES_USER:-social_network}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    volumes: [postgres_data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 12

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes: [redis_data:/data]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 12

  web:
    build:
      context: ./backend
      args:
        PIP_INDEX_URL: ${PIP_INDEX_URL:-https://pypi.org/simple}
    restart: unless-stopped
    command: gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers ${GUNICORN_WORKERS:-3} --timeout 120 --access-logfile -
    environment: *backend-environment
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
    expose: ["8000"]
    healthcheck:
      test: ["CMD", "python", "-c", "import os, urllib.request; host=os.environ['DJANGO_ALLOWED_HOSTS'].split(',')[0].strip(); request=urllib.request.Request('http://127.0.0.1:8000/api/health/', headers={'Host': host, 'X-Forwarded-Proto': 'https'}); urllib.request.urlopen(request, timeout=5).read()"]
      interval: 30s
      timeout: 15s
      retries: 5

  worker:
    build:
      context: ./backend
      args:
        PIP_INDEX_URL: ${PIP_INDEX_URL:-https://pypi.org/simple}
    restart: unless-stopped
    command: celery -A config worker --loglevel=info --concurrency=${CELERY_CONCURRENCY:-4} --queues=default
    environment: *backend-environment
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}

  beat:
    build: ./backend
    restart: unless-stopped
    command: celery -A config beat --loglevel=info
    environment: *backend-environment
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
      args:
        NPM_REGISTRY: ${NPM_REGISTRY:-https://registry.npmjs.org}
    restart: unless-stopped
    ports: ["127.0.0.1:8080:80"]
    depends_on:
      web: {condition: service_healthy}

  backup:
    image: postgres:16-alpine
    profiles: ["ops"]
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-social_network}
      POSTGRES_USER: ${POSTGRES_USER:-social_network}
      PGPASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_HOST: postgres
      BACKUP_RETENTION_DAYS: "14"
    volumes:
      - ./ops:/ops:ro
      - backups:/backups
    entrypoint: ["/bin/sh", "/ops/backup.sh"]
    depends_on:
      postgres: {condition: service_healthy}

  ml-worker:
    profiles: ["ml"]
    build:
      context: ./backend
      dockerfile: Dockerfile.ml
    command: celery -A config worker --loglevel=info --concurrency=1 --queues=ml
    environment: *backend-environment
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}

volumes:
  postgres_data:
  redis_data:
  backups:
