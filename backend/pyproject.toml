[project]
name = "social-network-teaching-backend"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "Django>=5.2,<5.3",
    "djangorestframework>=3.16,<3.17",
    "psycopg[binary]>=3.2,<3.3",
    "celery[redis]>=5.4,<5.5",
    "gunicorn>=23,<24",
    "openpyxl>=3.1,<4",
    "networkx>=3.4,<3.5; python_version < '3.11'",
    "networkx>=3.4,<4; python_version >= '3.11'",
    "numpy>=2.0,<2.3; python_version < '3.14'",
    "numpy>=2.3,<3; python_version >= '3.14'",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["config*", "learning*"]

[project.optional-dependencies]
dev = [
    "pytest>=8.3,<9",
    "pytest-django>=4.9,<5",
    "PyYAML>=6.0,<7",
]
ml = [
    "torch>=2.5,<3",
    "torch-geometric>=2.6,<3",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
python_files = ["test_*.py", "*_tests.py"]
testpaths = ["tests"]
